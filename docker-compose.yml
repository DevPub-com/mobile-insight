services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobile_insight
      POSTGRES_USER: mobile_insight
      POSTGRES_PASSWORD: mobile_insight
    ports:
      - "5432:5432"
    volumes:
      - mobile_insight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile_insight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mobile_insight_postgres:
