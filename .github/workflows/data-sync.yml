name: Scheduled Data Synchronization

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Synchronization Type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - voc
          - metrics

permissions:
  contents: read

concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Determine Synchronization Scope
        id: determine-scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.sync_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "scope=all" >> $GITHUB_OUTPUT
          else
            echo "scope=voc" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
      - name: Validate synchronization secrets
        env: &sync-env
          SYNC_SCOPE: ${{ steps.determine-scope.outputs.scope }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_KIS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_KIS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_KIS_BUCKET_NAME: ${{ secrets.GOOGLE_KIS_BUCKET_NAME }}
          APPLE_KIS_ISSUER_ID: ${{ secrets.APPLE_KIS_ISSUER_ID }}
          APPLE_KIS_KEY_ID: ${{ secrets.APPLE_KIS_KEY_ID }}
          APPLE_KIS_PRIVATE_KEY: ${{ secrets.APPLE_KIS_PRIVATE_KEY }}
          APPLE_KIS_VENDOR_NUMBER: ${{ secrets.APPLE_KIS_VENDOR_NUMBER }}
          GA4_KIS_PROPERTY_ID: ${{ secrets.GA4_KIS_PROPERTY_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-sync-env.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Synchronize directly on the runner
        env: *sync-env
        run: node --import tsx scripts/sync.ts
