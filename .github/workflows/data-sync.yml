name: Scheduled Data Synchronization

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Synchronization Type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - voc
          - metrics

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Synchronization Scope
        id: determine-scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.sync_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "scope=all" >> $GITHUB_OUTPUT
          else
            echo "scope=voc" >> $GITHUB_OUTPUT
          fi

      - name: Request Synchronization Endpoint
        env:
          TARGET_URL: ${{ secrets.APPLICATION_URL || secrets.APP_URL }}
          BEARER_TOKEN: ${{ secrets.SYNCHRONIZATION_SECRET || secrets.SYNC_SECRET }}
        run: |
          curl --fail --show-error --silent --location \
            --request POST "${TARGET_URL}/api/sync?type=${{ steps.determine-scope.outputs.scope }}" \
            --header "Authorization: Bearer ${BEARER_TOKEN}"
